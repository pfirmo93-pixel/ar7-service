<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR7 Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --bg:#F2F6F6;
    --surface:#FFFFFF;
    --surface-2:#E7EFEF;
    --ink:#132226;
    --muted:#5B7074;
    --line:#D7E3E3;
    --accent:#0E7C86;
    --accent-strong:#0A5F67;
    --accent-ink:#FFFFFF;
    --accent-soft:#DCEEEF;
    --warn:#B5722A;
    --warn-soft:#F4E5D3;
    --danger:#B23A3A;
    --danger-soft:#F5DEDE;
    --good:#2E8B57;
    --good-soft:#DCEFE2;
    --shadow: 0 1px 2px rgba(19,34,38,.06), 0 8px 24px -12px rgba(19,34,38,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0C1517;
      --surface:#121E21;
      --surface-2:#182528;
      --ink:#E6EFEF;
      --muted:#8CA3A6;
      --line:#233336;
      --accent:#3CBBB4;
      --accent-strong:#5FD1C9;
      --accent-ink:#052224;
      --accent-soft:#153231;
      --warn:#D89A54;
      --warn-soft:#2E2519;
      --danger:#E58080;
      --danger-soft:#331E1E;
      --good:#5FCB8E;
      --good-soft:#173225;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0C1517;
    --surface:#121E21;
    --surface-2:#182528;
    --ink:#E6EFEF;
    --muted:#8CA3A6;
    --line:#233336;
    --accent:#3CBBB4;
    --accent-strong:#5FD1C9;
    --accent-ink:#052224;
    --accent-soft:#153231;
    --warn:#D89A54;
    --warn-soft:#2E2519;
    --danger:#E58080;
    --danger-soft:#331E1E;
    --good:#5FCB8E;
    --good-soft:#173225;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px -12px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; max-width:100%; overflow-x:hidden;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Manrope", ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  ::selection{ background:var(--accent-soft); }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  h1,h2,h3{ text-wrap:balance; margin:0; }

  /* ---------- Shell layout ---------- */
  .shell{
    display:grid;
    grid-template-columns: 236px 1fr;
    min-height:100vh;
  }
  @media (max-width: 860px){
    html, body{ overflow-x:hidden; }
    .shell{ grid-template-columns: 1fr; max-width:100vw; }
    .sidebar{ position:sticky; top:0; z-index:20; }
  }

  .sidebar{
    background:var(--surface);
    border-right:1px solid var(--line);
    padding:22px 16px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }
  @media (max-width:860px){
    .sidebar{ border-right:none; border-bottom:1px solid var(--line); flex-direction:row; align-items:center; padding:8px 10px; gap:6px; max-width:100vw; }
    .sidebar .brand-block{ flex:none; }
    .sidebar nav{
      flex-direction:row; flex:1; gap:2px; min-width:0;
      justify-content:space-between;
    }
    .sidebar .side-foot{ display:none; }
    .nav-btn{
      width:auto; flex:1 1 0; min-width:0; max-width:64px; padding:7px 2px; font-size:9px; gap:3px;
      flex-direction:column; text-align:center; border-radius:8px; white-space:nowrap; overflow:hidden;
      touch-action:manipulation;
    }
    .nav-btn span{ overflow:hidden; text-overflow:ellipsis; max-width:100%; }
    .nav-btn svg{ width:19px; height:19px; }
    .nav-btn .count{ display:none; }
    .brand-tag{ display:none; }
  }

  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand-logo{
    display:inline-flex; align-items:center; justify-content:center; flex:none;
    background:#FFFFFF; border-radius:9px; padding:5px 9px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.06);
  }
  .brand-logo img{ height:26px; width:auto; display:block; }
  .brand-text{ display:flex; flex-direction:column; line-height:1.15; }
  .brand-name{ font-weight:800; font-size:16.5px; letter-spacing:.01em; }
  .brand-tag{ font-size:11px; color:var(--muted); font-family:"IBM Plex Mono",monospace; letter-spacing:.05em; text-transform:uppercase; }

  nav{ display:flex; flex-direction:column; gap:4px; }
  .nav-btn{
    display:flex; align-items:center; gap:10px;
    padding:10px 12px; border-radius:10px;
    border:1px solid transparent; background:transparent;
    color:var(--muted); font-size:14.5px; font-weight:600;
    cursor:pointer; text-align:left; width:100%;
  }
  .nav-btn:hover{ background:var(--surface-2); color:var(--ink); }
  .nav-btn.active{ background:var(--accent-soft); color:var(--accent-strong); }
  .nav-btn svg{ width:18px; height:18px; flex:none; }
  .nav-btn .count{
    margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:11px;
    background:var(--surface-2); color:var(--muted); padding:1px 7px; border-radius:99px;
  }
  .nav-btn.active .count{ background:var(--surface); color:var(--accent-strong); }

  .side-foot{ margin-top:auto; font-size:12px; color:var(--muted); }
  .side-foot button{
    width:100%; padding:8px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface); color:var(--muted); font-size:12.5px; cursor:pointer; font-weight:600;
  }
  .side-foot button:hover{ color:var(--ink); border-color:var(--muted); }
  .sync-note{ margin-top:8px; display:flex; gap:6px; align-items:center; font-size:11.5px; }
  .sync-dot{ width:7px; height:7px; border-radius:99px; background:var(--good); flex:none; }
  .sync-dot.pending{ background:var(--warn); }
  .sync-dot.off{ background:var(--muted); }

  main{ padding:28px 32px 80px; max-width:1100px; }
  @media (max-width:640px){ main{ padding:18px 16px 60px; } }

  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:22px; flex-wrap:wrap; }
  .page-head h1{ font-size:24px; font-weight:800; }
  .page-head p{ margin:4px 0 0; color:var(--muted); font-size:13.5px; }
  .btn{
    display:inline-flex; align-items:center; gap:7px;
    padding:10px 16px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-weight:700; font-size:13.5px;
    cursor:pointer;
  }
  .btn:hover{ border-color:var(--muted); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .btn.primary:hover{ background:var(--accent-strong); border-color:var(--accent-strong); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--muted); }
  .btn.ghost:hover{ color:var(--ink); background:var(--surface-2); }
  .btn.danger{ color:var(--danger); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn svg{ width:15px; height:15px; }

  /* ---------- Dashboard ---------- */
  .quick-actions{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:20px; }
  @media (max-width:560px){ .quick-actions{ grid-template-columns:1fr; } }
  .quick-btn{
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    padding:16px 10px; border-radius:14px; border:1px solid var(--line); background:var(--surface);
    color:var(--ink); font-weight:700; font-size:13px; cursor:pointer; min-width:0; text-align:center;
  }
  .quick-btn:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .quick-btn svg{ width:22px; height:22px; color:var(--accent-strong); flex:none; }
  .quick-btn span{ overflow-wrap:break-word; }
  .stat-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:26px; }
  .stat-grid-3{ grid-template-columns:repeat(3,1fr); }
  @media (max-width:520px){ .stat-grid-3{ grid-template-columns:1fr 1fr; } .stat-grid-3 .stat-card:last-child{ grid-column:1 / -1; } }
  .stat-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }
  .stat-card .n{ font-family:"IBM Plex Mono",monospace; font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; }
  .stat-card .l{ font-size:12.5px; color:var(--muted); margin-top:2px; }

  .section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); font-weight:700; margin:26px 0 10px; }
  .section-title:first-child{ margin-top:0; }

  .list-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
  .row-item{ display:flex; align-items:center; gap:14px; padding:13px 16px; border-bottom:1px solid var(--line); }
  .row-item:last-child{ border-bottom:none; }
  .row-item .who{ font-weight:700; font-size:14px; }
  .row-item .meta{ font-size:12.5px; color:var(--muted); }
  .row-item .side{ margin-left:auto; text-align:right; }
  .empty-note{ padding:26px 16px; text-align:center; color:var(--muted); font-size:13.5px; }

  .pill{ display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:99px; font-size:11.5px; font-weight:700; letter-spacing:.02em; }
  .pill.good{ background:var(--good-soft); color:var(--good); }
  .pill.warn{ background:var(--warn-soft); color:var(--warn); }
  .pill.danger{ background:var(--danger-soft); color:var(--danger); }
  .pill.muted{ background:var(--surface-2); color:var(--muted); }

  /* ---------- Table views ---------- */
  .toolbar{ display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap; align-items:center; }
  .search{
    flex:1; min-width:180px; padding:9px 13px; border-radius:10px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink); font-size:13.5px;
  }
  .search:focus{ outline:2px solid var(--accent); outline-offset:1px; }

  .card-grid{ display:grid; gap:12px; }
  .entity-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; max-width:100%; }
  .entity-card .avatar{
    width:40px; height:40px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center;
    background:var(--accent-soft); color:var(--accent-strong); font-weight:800; font-size:15px;
  }
  .entity-main{ flex:1; min-width:0; }
  .entity-main .name{ font-weight:800; font-size:15.5px; overflow-wrap:anywhere; }
  .entity-main .sub{ color:var(--muted); font-size:12.5px; margin-top:2px; display:flex; gap:12px; flex-wrap:wrap; overflow-wrap:anywhere; min-width:0; }
  .entity-main .sub span{ overflow-wrap:anywhere; min-width:0; }
  .entity-actions{ display:flex; gap:6px; flex:1 1 auto; flex-wrap:wrap; justify-content:flex-end; min-width:0; }
  @media (max-width:480px){
    .entity-actions{ justify-content:flex-start; margin-left:54px; }
  }
  .icon-btn{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--muted);
  }
  .icon-btn:hover{ color:var(--ink); border-color:var(--muted); }
  .icon-btn svg{ width:15px; height:15px; }

  .quote-total{ font-family:"IBM Plex Mono",monospace; font-weight:600; font-variant-numeric:tabular-nums; }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(10,18,20,.5); display:flex; align-items:flex-start; justify-content:center;
    padding:5vh 16px; overflow-y:auto; z-index:100;
  }
  .overlay[hidden]{ display:none; }
  .modal{
    background:var(--surface); border-radius:16px; border:1px solid var(--line); width:100%; max-width:560px;
    box-shadow:0 24px 60px -20px rgba(0,0,0,.4); animation:pop .16s ease;
  }
  @media (prefers-reduced-motion:reduce){ .modal{ animation:none; } }
  @keyframes pop{ from{ opacity:0; transform:translateY(6px) scale(.99);} to{opacity:1; transform:none;} }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 20px; border-bottom:1px solid var(--line); }
  .modal-head h2{ font-size:16.5px; font-weight:800; }
  .modal-body{ padding:20px; display:flex; flex-direction:column; gap:14px; }
  .modal-foot{ padding:16px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:8px; }

  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12.5px; font-weight:700; color:var(--muted); }
  .field input, .field select, .field textarea{
    padding:9px 12px; border-radius:9px; border:1px solid var(--line); background:var(--bg); color:var(--ink);
    font-family:inherit; font-size:14px;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; border-color:var(--accent); }
  .field textarea{ resize:vertical; min-height:64px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:480px){ .field-row{ grid-template-columns:1fr; } }

  .items-editor{ display:flex; flex-direction:column; gap:8px; }
  .item-row{ display:grid; grid-template-columns:1fr 60px 96px 32px; gap:8px; align-items:center; }
  @media (max-width:480px){ .item-row{ grid-template-columns:1fr 46px 78px 28px; } }
  .item-row input{ padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font-size:13.5px; width:100%; }
  .item-row .rm{ width:28px; height:28px; border-radius:7px; border:1px solid var(--line); background:var(--surface); color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .add-item-btn{ align-self:flex-start; font-size:12.5px; font-weight:700; color:var(--accent-strong); background:none; border:none; cursor:pointer; padding:4px 0; }
  .items-total{ display:flex; justify-content:flex-end; gap:10px; font-size:14px; padding-top:6px; border-top:1px dashed var(--line); }
  .items-total b{ font-family:"IBM Plex Mono",monospace; font-size:16px; }

  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:10px 18px; border-radius:99px; font-size:13px; font-weight:600;
    box-shadow:0 10px 30px -10px rgba(0,0,0,.4); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-4px); }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
</style>
</head>

  var AR7_LOGO_RATIO = 1320/798;

  function seedData(){
    return {
      company: { name:"AR7 RJ Service Inc", phone:"(954) 861-9660", email:"Andrerossa73@hotmail.com", address:"875 NE 48th St, Lot 417, Deerfield Beach, FL 33064", note:"Transform your home." },
      seq: { quote: 0, invoice: 0 },
      clients: [],
      quotes: [],
      appts: []
    };
  }

  function loadInitialState(){
    try{
      var el = document.getElementById("ar7-data");
      if(el && el.textContent){
        var txt = el.textContent.trim();
        if(txt && txt.indexOf("{}") === -1){
          var parsed = JSON.parse(txt);
          if(parsed && typeof parsed === "object") return normalize(parsed);
        }
      }
    }catch(e){ console.warn("AR7: failed to read embedded data", e); }
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){ return normalize(JSON.parse(raw)); }
    }catch(e){ console.warn("AR7: failed to read localStorage", e); }
    return seedData();
  }

  function normalize(d){
    var s = seedData();
    d = d || {};
    s.company = Object.assign(s.company, d.company || {});
    s.seq = Object.assign(s.seq, d.seq || {});
    s.clients = Array.isArray(d.clients) ? d.clients : [];
    s.quotes = Array.isArray(d.quotes) ? d.quotes : [];
    s.appts = Array.isArray(d.appts) ? d.appts : [];
    return s;
  }

  var state = loadInitialState();
  var view = "painel";
  var search = "";
  var claudeArtifact = null;
  var capabilityChecked = false;

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function fmtMoney(n){
    n = Number(n)||0;
    return "$" + n.toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtDate(iso){
    if(!iso) return "—";
    var p = iso.split("-");
    if(p.length!==3) return iso;
    return p[1]+"/"+p[2]+"/"+p[0];
  }
  function todayIso(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function clientById(id){ return state.clients.find(function(c){return c.id===id;}); }
  function escapeHtml(s){
    return String(s==null?"":s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ---------------- persistence ---------------- */
  var saveTimer = null;
  var savePending = false;

  function markPending(){
    savePending = true;
    var dot = document.getElementById("syncDot");
    var label = document.getElementById("syncLabel");
    if(dot){ dot.className = "sync-dot pending"; }
    if(label){ label.textContent = "Saving…"; }
  }
  function markSaved(ok){
    savePending = false;
    var dot = document.getElementById("syncDot");
    var label = document.getElementById("syncLabel");
    if(dot){ dot.className = "sync-dot" + (ok ? "" : " off"); }
    if(label){ label.textContent = ok ? "Saved" : "Saved on this device"; }
  }

  function scheduleSave(){
    markPending();
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(persistToArtifact, 700);
  }

  function embedDataInHtml(html, dataStr){
    var startTag = '<script id="ar7-data" type="application/json">';
    var i = html.indexOf(startTag);
    if(i === -1) return null;
    var j = html.indexOf("<\/script>", i);
    if(j === -1) return null;
    return html.slice(0, i + startTag.length) + dataStr + html.slice(j);
  }

  function persistToArtifact(){
    var dataStr = JSON.stringify(state).replace(/</g, "\\u003c");
    if(!capabilityChecked){
      markSaved(true);
      return;
    }
    if(!claudeArtifact){
      markSaved(false);
      return;
    }
    fetch(location.href, {cache:"no-store"}).then(function(res){ return res.text(); }).then(function(html){
      var next = embedDataInHtml(html, dataStr);
      if(!next) throw new Error("marker not found");
      return claudeArtifact.publish(next);
    }).then(function(){
      markSaved(true);
    }).catch(function(err){
      console.warn("AR7: publish failed, keeping local copy", err);
      markSaved(false);

  function initCapability(){

      markSaved(false);
      return;

    window.claude.use("artifact").then(function(ns){
      claudeArtifact = ns;
      capabilityChecked = true;
      markSaved(!!ns);
    }).catch(function(){
      capabilityChecked = true;
      markSaved(false);
    });

  function quoteTotal(q){
    var subtotal = (q.items||[]).reduce(function(sum,it){ return sum + (Number(it.qty)||0)*(Number(it.price)||0); },0);
    var disc = Number(q.discount)||0;
    return Math.max(0, subtotal - disc);
  }

  function bindMainEvents(){
    var saveSettingsBtn = document.getElementById("saveSettingsBtn");
    if(saveSettingsBtn){
      saveSettingsBtn.addEventListener("click", function(){
        state.company.name = document.getElementById("s-name").value.trim() || "AR7 RJ Service";
        state.company.phone = document.getElementById("s-phone").value.trim();
        state.company.email = document.getElementById("s-email").value.trim();
        state.company.address = document.getElementById("s-address").value.trim();
        scheduleSave();
        toast("Settings saved");
      });
    }
    var sInput = document.getElementById("clientSearch") || document.getElementById("quoteSearch");
    if(sInput){
      sInput.addEventListener("input", function(e){
        search = e.target.value;
        var main = document.getElementById("main");
        if(view==="clientes") main.innerHTML = renderClientes();
        else if(view==="orcamentos") main.innerHTML = renderOrcamentos();
        bindMainEvents();
        document.getElementById(view==="clientes"?"clientSearch":"quoteSearch").focus();
        var el = document.getElementById(view==="clientes"?"clientSearch":"quoteSearch");
        el.selectionStart = el.selectionEnd = el.value.length;
      });
    }
    document.querySelectorAll("[data-open]").forEach(function(btn){
      btn.addEventListener("click", function(){
        var kind = btn.getAttribute("data-open");
        var presetClient = btn.getAttribute("data-client");
        openForm(kind, null, presetClient);
      });
    });
    document.querySelectorAll("[data-edit]").forEach(function(btn){
      btn.addEventListener("click", function(){
        openForm(btn.getAttribute("data-edit"), btn.getAttribute("data-id"));
      });
    });
    document.querySelectorAll("[data-del]").forEach(function(btn){
      btn.addEventListener("click", function(){
        handleDelete(btn.getAttribute("data-del"), btn.getAttribute("data-id"));
      });
    });
    document.querySelectorAll("[data-pdf]").forEach(function(btn){
      btn.addEventListener("click", function(){
        generateQuotePdf(btn.getAttribute("data-id"));
      });
    });
    document.querySelectorAll("[data-msg]").forEach(function(btn){
      btn.addEventListener("click", function(){
        openMessageModal(btn.getAttribute("data-id"));
      });
    });
    document.querySelectorAll("[data-invoice]").forEach(function(btn){
      btn.addEventListener("click", function(){
        openInvoiceForm(btn.getAttribute("data-id"));
      });
    });
    document.querySelectorAll("[data-status]").forEach(function(sel){
      sel.addEventListener("change", function(){
        var kind = sel.getAttribute("data-status");
        var id = sel.getAttribute("data-id");
        if(kind==="quote"){
          var q = state.quotes.find(function(x){return x.id===id;});
          if(q) q.status = sel.value;
        } else {
          var a = state.appts.find(function(x){return x.id===id;});
          if(a) a.status = sel.value;
        }
        scheduleSave();
        render();
        toast("Status updated");
      });
    });
  }

  function handleDelete(kind, id){
    var label = kind==="client" ? "customer" : kind==="quote" ? "quote" : "appointment";
    if(!window.confirm("Delete this "+label+"? This action cannot be undone.")) return;
    if(kind==="client"){ state.clients = state.clients.filter(function(c){return c.id!==id;}); }
    if(kind==="quote"){ state.quotes = state.quotes.filter(function(q){return q.id!==id;}); }
    if(kind==="appt"){ state.appts = state.appts.filter(function(a){return a.id!==id;}); }
    scheduleSave();
    render();
    toast("Deleted");
  }

  /* ---------------- forms / modal ---------------- */
  function closeModal(){
    document.getElementById("overlay").setAttribute("hidden","");
    document.getElementById("modalBox").innerHTML = "";

  function openForm(kind, id, presetClient){
    if(kind==="client") return openClientForm(id);
    if(kind==="quote") return openQuoteForm(id, presetClient);
    if(kind==="appt") return openApptForm(id, presetClient);

      '<div class="modal-body">'+bodyHtml+'</div>'+
      '<div class="modal-foot">'+footHtml+'</div>';
    document.getElementById("overlay").removeAttribute("hidden");
    document.getElementById("modalClose").addEventListener("click", closeModal);

        '<div class="field"><label>Phone</label><input id="f-phone" value="'+escapeHtml(c.phone)+'" placeholder="(555) 123-4567"></div>'+

      '</div>'+
      '<div class="field"><label>Address</label><input id="f-address" value="'+escapeHtml(c.address)+'" placeholder="Street, number, city"></div>'+
      '<div class="field"><label>Notes</label><textarea id="f-notes" placeholder="Internal notes">'+escapeHtml(c.notes||"")+'</textarea></div>';
    modalShell(id?"Edit customer":"New customer", body, '<button class="btn ghost" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Save</button>');
    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    document.getElementById("saveBtn").addEventListener("click", function(){
      var name = document.getElementById("f-name").value.trim();
      if(!name){ toast("Enter the customer\u2019s name"); return; }
      var data = {
        name: name,
        phone: document.getElementById("f-phone").value.trim(),
        email: document.getElementById("f-email").value.trim(),
        address: document.getElementById("f-address").value.trim(),
        notes: document.getElementById("f-notes").value.trim()
      };
      if(id){ Object.assign(c, data); }
      else { data.id = uid(); state.clients.push(data); }
      scheduleSave();
      closeModal();
      render();
      toast("Customer saved");
    });
  }

  function openApptForm(id, presetClient){
    var a = id ? state.appts.find(function(x){return x.id===id;}) : {clientId:presetClient||"", service:"", date:todayIso(), time:"", address:"", notes:"", status:"agendado"};
    var body =
      '<div class="field"><label>Customer</label><select id="f-client">'+clientOptions(a.clientId)+'</select></div>'+
      '<div class="field"><label>Service</label><input id="f-service" list="serviceOptions" value="'+escapeHtml(a.service)+'" placeholder="e.g. Duct Cleaning">'+serviceDatalist()+'</div>'+
      '<div class="field"><label>Date</label><input type="date" id="f-date" value="'+a.date+'"></div>'+
      '<div class="field"><label>Service address</label><input id="f-address" value="'+escapeHtml(a.address||"")+'" placeholder="Leave blank to use the customer\u2019s address"></div>'+
      '<div class="field"><label>Notes</label><textarea id="f-notes">'+escapeHtml(a.notes||"")+'</textarea></div>';
    modalShell(id?"Edit appointment":"New appointment", body,
      '<button class="btn ghost" id="cancelBtn">Cancel</button>'+
      (id ? '<button class="btn" id="invBtnInForm">'+ICONS.pdf+' Send Invoice</button>' : '')+
      '<button class="btn primary" id="saveBtn">Save</button>');
    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    if(id){
      document.getElementById("invBtnInForm").addEventListener("click", function(){
        closeModal();
        openInvoiceForm(id);
      });
    }
    document.getElementById("saveBtn").addEventListener("click", function(){
      var clientId = document.getElementById("f-client").value;
      var service = document.getElementById("f-service").value.trim();
      if(!clientId){ toast("Select a customer"); return; }
      if(!service){ toast("Describe the service"); return; }
      var data = {
        clientId: clientId,
        service: service,
        date: document.getElementById("f-date").value || todayIso(),
        time: "",
        address: document.getElementById("f-address").value.trim(),
        notes: document.getElementById("f-notes").value.trim()
      };
      if(id){ Object.assign(a, data); }
      else { data.id = uid(); data.status = "agendado"; state.appts.push(data); }
      scheduleSave();
      closeModal();
      render();
      toast("Appointment saved");
    });
  }

  function openQuoteForm(id, presetClient){
    var q = id ? state.quotes.find(function(x){return x.id===id;}) : {
      clientId: presetClient||"", date: todayIso(), validDays:7, discount:0, notes:"",
      items:[{desc:"",qty:1,price:0}], status:"rascunho"
    };
    var body =
      '<div class="field"><label>Customer</label><select id="f-client">'+clientOptions(q.clientId)+'</select></div>'+
      '<div class="field-row">'+
        '<div class="field"><label>Date</label><input type="date" id="f-date" value="'+q.date+'"></div>'+
        '<div class="field"><label>Valid for (days)</label><input type="number" id="f-valid" min="0" value="'+(q.validDays!=null?q.validDays:7)+'"></div>'+
      '</div>'+
      '<div class="field"><label>Line items</label><div class="items-editor" id="itemsEditor"></div>'+
        '<button type="button" class="add-item-btn" id="addItem">'+ '+ add item'+'</button></div>'+
      '<div class="field"><label>Discount ($)</label><input type="number" id="f-discount" min="0" step="0.01" value="'+(q.discount||0)+'"></div>'+
      '<div class="items-total"><span>Total:</span> <b class="mono" id="liveTotal">'+fmtMoney(0)+'</b></div>'+
      '<div class="field"><label>Notes / terms</label><textarea id="f-notes" placeholder="Payment terms, warranty, etc.">'+escapeHtml(q.notes||"")+'</textarea></div>';
    modalShell(id?"Edit quote":"New quote", body, '<button class="btn ghost" id="cancelBtn">Cancel</button><button class="btn primary" id="saveBtn">Save</button>');

    var items = (q.items && q.items.length ? q.items : [{desc:"",qty:1,price:0}]).map(function(it){ return Object.assign({},it); });

    function renderItems(){
      var editor = document.getElementById("itemsEditor");
      editor.innerHTML = serviceDatalist() + items.map(function(it, idx){
        return '<div class="item-row" data-idx="'+idx+'">'+
          '<input class="it-desc" list="serviceOptions" placeholder="Service / item description" value="'+escapeHtml(it.desc)+'">'+
          '<input class="it-qty" type="number" min="0" step="1" placeholder="Qty" value="'+it.qty+'">'+
          '<input class="it-price" type="number" min="0" step="0.01" placeholder="Price" value="'+it.price+'">'+
          '<button type="button" class="rm" data-idx="'+idx+'">'+ICONS.close+'</button>'+
        '</div>';
      }).join("");
      editor.querySelectorAll(".it-desc").forEach(function(inp,idx){ inp.addEventListener("input", function(){ items[idx].desc = inp.value; }); });
      editor.querySelectorAll(".it-qty").forEach(function(inp,idx){ inp.addEventListener("input", function(){ items[idx].qty = inp.value; updateTotal(); }); });
      editor.querySelectorAll(".it-price").forEach(function(inp,idx){ inp.addEventListener("input", function(){ items[idx].price = inp.value; updateTotal(); }); });
      editor.querySelectorAll(".rm").forEach(function(btn){
        btn.addEventListener("click", function(){
          var idx = Number(btn.getAttribute("data-idx"));
          if(items.length<=1) return;
          items.splice(idx,1);
          renderItems();
          updateTotal();
        });
      });
    }
    function updateTotal(){
      var subtotal = items.reduce(function(sum,it){ return sum + (Number(it.qty)||0)*(Number(it.price)||0); },0);
      var disc = Number(document.getElementById("f-discount").value)||0;
      document.getElementById("liveTotal").textContent = fmtMoney(Math.max(0, subtotal-disc));
    }
    renderItems();
    updateTotal();
    document.getElementById("addItem").addEventListener("click", function(){
      items.push({desc:"",qty:1,price:0});
      renderItems();
      updateTotal();
    });
    document.getElementById("f-discount").addEventListener("input", updateTotal);

    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    document.getElementById("saveBtn").addEventListener("click", function(){
      var clientId = document.getElementById("f-client").value;
      if(!clientId){ toast("Select a customer"); return; }
      var cleanItems = items.filter(function(it){ return it.desc && it.desc.trim(); }).map(function(it){
        return { desc: it.desc.trim(), qty: Number(it.qty)||0, price: Number(it.price)||0 };
      });
      if(cleanItems.length===0){ toast("Add at least one item"); return; }
      var data = {
        clientId: clientId,
        date: document.getElementById("f-date").value || todayIso(),
        validDays: Number(document.getElementById("f-valid").value)||0,
        discount: Number(document.getElementById("f-discount").value)||0,
        notes: document.getElementById("f-notes").value.trim(),
        items: cleanItems
      };
      if(id){ Object.assign(q, data); }
      else {
        data.id = uid();
        data.status = "rascunho";
        state.seq.quote = (state.seq.quote||0) + 1;
        var year = new Date().getFullYear();
        data.number = "QTE-" + year + "-" + String(state.seq.quote).padStart(3,"0");
        state.quotes.push(data);
      }
      scheduleSave();
      closeModal();
      render();
      toast("Quote saved");
    });
  }

  /* ---------------- customer message ---------------- */
  function buildQuoteMessage(q, c){
    var firstName = c ? (c.name||"").trim().split(/\s+/)[0] : "there";
    var company = state.company.name || "AR7 RJ Service";
    var lines = q.items.map(function(it){ return "- " + it.desc; });
    var greeting = "Hi " + firstName + ", this is " + company + ".";
    if(q.isInvoice){
      var ibody = "Here's your invoice " + q.number + " for " + lines.join(", ") + ".";
      var itotal = "Total due: " + fmtMoney(quoteTotal(q)) + ".";
      var iclosing = "Thanks for choosing us! Let me know if you have any questions.";
      return greeting + "\n\n" + ibody + "\n" + itotal + "\n\n" + iclosing;
    }
    var body = "Here's your quote " + q.number + " for " + lines.join(", ") + ".";
    var total = "Total: " + fmtMoney(quoteTotal(q)) + (q.validDays ? " (valid for " + q.validDays + " days)" : "") + ".";
    var closing = "Let me know if you'd like to move forward or have any questions!";
    return greeting + "\n\n" + body + "\n" + total + "\n\n" + closing;
  }

  function openInvoiceForm(apptId){
    var a = state.appts.find(function(x){return x.id===apptId;});
    if(!a) return;
    var c = clientById(a.clientId);
    var body =
      (c ? '<p style="margin:0; font-size:13px; color:var(--muted);">Customer: <b style="color:var(--ink);">'+escapeHtml(c.name)+'</b></p>' : '<p style="margin:0; font-size:12.5px; color:var(--danger);">This customer no longer exists — you can still invoice, but consider re-adding them.</p>')+
      '<div class="field"><label>Service</label><input id="f-inv-desc" list="serviceOptions" value="'+escapeHtml(a.service||"")+'">'+serviceDatalist()+'</div>'+
      '<div class="field"><label>Amount ($)</label><input id="f-inv-amount" type="number" min="0" step="0.01" placeholder="0.00"></div>'+
      '<div class="field"><label>Notes (optional)</label><textarea id="f-inv-notes" placeholder="Payment terms, warranty, etc."></textarea></div>';
    modalShell("Send Invoice", body, '<button class="btn ghost" id="cancelBtn">Cancel</button><button class="btn primary" id="createInvBtn">Create & Send</button>');
    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    document.getElementById("createInvBtn").addEventListener("click", function(){
      var desc = document.getElementById("f-inv-desc").value.trim();
      var amount = Number(document.getElementById("f-inv-amount").value);
      if(!desc){ toast("Describe the service"); return; }
      if(!amount || amount<=0){ toast("Enter the amount"); return; }
      var notes = document.getElementById("f-inv-notes").value.trim();
      state.seq.invoice = (state.seq.invoice||0) + 1;
      var year = new Date().getFullYear();
      var inv = {
        id: uid(),
        clientId: a.clientId,
        date: todayIso(),
        validDays: 0,
        discount: 0,
        notes: notes,
        items: [{desc: desc, qty:1, price: amount}],
        status: "aprovado",
        isInvoice: true,
        number: "INV-" + year + "-" + String(state.seq.invoice).padStart(3,"0")
      };
      state.quotes.push(inv);
      scheduleSave();
      closeModal();
      toast("Invoice created");
      generateQuotePdf(inv.id);
      openMessageModal(inv.id);
    });
  }

  function openMessageModal(id){
    var q = state.quotes.find(function(x){return x.id===id;});
    if(!q) return;
    var c = clientById(q.clientId);
    var text = buildQuoteMessage(q, c);
    var waNumber = c && c.phone ? c.phone.replace(/[^0-9]/g,"") : "";
    var body =
      '<div class="field"><label>Ready-to-send message</label><textarea id="msgText" style="min-height:150px;">'+escapeHtml(text)+'</textarea></div>'+
      (c && c.phone ? '<p style="margin:0; font-size:12.5px; color:var(--muted);">Customer phone on file: '+escapeHtml(c.phone)+'</p>' : '<p style="margin:0; font-size:12.5px; color:var(--muted);">No phone on file for this customer — add one to send via WhatsApp.</p>');
    var footBtns = '<button class="btn ghost" id="closeMsgBtn">Close</button>'+
      '<button class="btn" id="copyMsgBtn">Copy text</button>'+
      '<button class="btn primary" id="sharePdfBtn">'+ICONS.pdf+' Share PDF'+(waNumber?' via WhatsApp':'')+'</button>'+
      (waNumber ? '<button class="btn ghost" id="waMsgBtn">Text only</button>' : '');
    modalShell("Message for " + (c?c.name:"customer"), body, footBtns);
    document.getElementById("closeMsgBtn").addEventListener("click", closeModal);
    document.getElementById("copyMsgBtn").addEventListener("click", function(){
      var ta = document.getElementById("msgText");
      ta.select();
      try{
        navigator.clipboard.writeText(ta.value).then(function(){ toast("Message copied"); }).catch(function(){
          document.execCommand("copy"); toast("Message copied");
        });
      }catch(e){
        try{ document.execCommand("copy"); toast("Message copied"); }catch(e2){ toast("Couldn't copy — select and copy manually"); }
      }
    });
    document.getElementById("sharePdfBtn").addEventListener("click", function(){
      shareQuotePdf(id);
    });
    if(waNumber){
      document.getElementById("waMsgBtn").addEventListener("click", function(){
        var msg = document.getElementById("msgText").value;
        window.open("https://wa.me/"+waNumber+"?text="+encodeURIComponent(msg), "_blank");
      });
    }
  }

  /* ---------------- PDF ---------------- */
  function buildQuotePdf(q, c){
    if(!window.jspdf){ toast("Could not load the PDF generator"); return null; }
    var jsPDF = window.jspdf.jsPDF;
    var doc = new jsPDF({unit:"pt", format:"a4"});
    var pageW = doc.internal.pageSize.getWidth();
    var marginX = 48;
    var y = 56;

    doc.setFillColor(14,124,134);
    doc.rect(0,0,pageW,10,"F");

    var logoH = 40, logoW = logoH * AR7_LOGO_RATIO;
    try{ doc.addImage(AR7_LOGO, "JPEG", marginX, 28, logoW, logoH); }catch(e){
      doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(20,38,42);
      doc.text(state.company.name || "AR7 RJ Service", marginX, y);
    }
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(90,110,113);
    var compLines = [state.company.phone, state.company.email, state.company.address].filter(Boolean);
    var compY = 28 + logoH + 13;
    compLines.forEach(function(line){
      var wrapped = doc.splitTextToSize(line, (pageW - marginX*2) * 0.5);
      doc.text(wrapped, marginX, compY);
      compY += 12 * wrapped.length;
    });

    doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(20,38,42);
    doc.text(q.isInvoice ? "INVOICE" : "QUOTE", pageW-marginX, 56, {align:"right"});
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(90,110,113);
    doc.text(q.number, pageW-marginX, 72, {align:"right"});
    doc.text("Date: " + fmtDate(q.date), pageW-marginX, 86, {align:"right"});
    if(q.validDays) doc.text("Valid for " + q.validDays + " days", pageW-marginX, 100, {align:"right"});

    y = Math.max(128, compY + 8, 114);
    doc.setDrawColor(215,227,227); doc.line(marginX, y, pageW-marginX, y);
    y += 22;

    doc.setFont("helvetica","bold"); doc.setFontSize(11); doc.setTextColor(20,38,42);
    doc.text("Customer", marginX, y);
    y += 16;
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(60,75,78);
    doc.text(c ? c.name : "Customer removed", marginX, y); y += 14;
    if(c && c.phone){ doc.text(c.phone, marginX, y); y += 14; }
    if(c && c.email){ doc.text(c.email, marginX, y); y += 14; }
    if(c && c.address){ doc.text(c.address, marginX, y); y += 14; }

    y += 14;
    var tableTop = y;
    doc.setFillColor(220,238,239);
    doc.rect(marginX, y-14, pageW-marginX*2, 22, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(9.5); doc.setTextColor(10,95,103);
    doc.text("DESCRIPTION", marginX+8, y);
    doc.text("QTY", pageW-marginX-190, y, {align:"right"});
    doc.text("UNIT PRICE", pageW-marginX-100, y, {align:"right"});
    doc.text("SUBTOTAL", pageW-marginX-8, y, {align:"right"});
    y += 22;

    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(30,45,48);
    q.items.forEach(function(it, idx){
      var lineTotal = (Number(it.qty)||0)*(Number(it.price)||0);
      var lines = doc.splitTextToSize(it.desc, pageW-marginX*2-260);
      var lineH = 14 * Math.max(1, lines.length);
      if(idx % 2 === 1){
        doc.setFillColor(247,250,250);
        doc.rect(marginX, y-11, pageW-marginX*2, lineH+4, "F");
      }
      doc.text(lines, marginX+8, y);
      doc.text(String(it.qty), pageW-marginX-190, y, {align:"right"});
      doc.text(fmtMoney(it.price), pageW-marginX-100, y, {align:"right"});
      doc.text(fmtMoney(lineTotal), pageW-marginX-8, y, {align:"right"});
      y += lineH + 4;
    });

    y += 6;
    doc.setDrawColor(215,227,227); doc.line(marginX, y, pageW-marginX, y);
    y += 20;

    var subtotal = q.items.reduce(function(s,it){ return s+(Number(it.qty)||0)*(Number(it.price)||0); },0);
    if(q.discount){
      doc.setFontSize(10); doc.setTextColor(90,110,113);
      doc.text("Subtotal", pageW-marginX-100, y, {align:"right"});
      doc.text(fmtMoney(subtotal), pageW-marginX-8, y, {align:"right"});
      y += 16;
      doc.text("Discount", pageW-marginX-100, y, {align:"right"});
      doc.text("- " + fmtMoney(q.discount), pageW-marginX-8, y, {align:"right"});
      y += 18;
    }
    doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(14,95,103);
    doc.text("TOTAL", pageW-marginX-100, y, {align:"right"});
    doc.text(fmtMoney(quoteTotal(q)), pageW-marginX-8, y, {align:"right"});

    if(q.notes){
      y += 36;
      doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(20,38,42);
      doc.text("Notes", marginX, y);
      y += 14;
      doc.setFont("helvetica","normal"); doc.setFontSize(9.5); doc.setTextColor(90,110,113);
      var noteLines = doc.splitTextToSize(q.notes, pageW-marginX*2);
      doc.text(noteLines, marginX, y);
    }

    var blob = doc.output("blob");
    var filename = q.number + "_" + (c?c.name.replace(/[^a-z0-9]+/gi,"_"):"customer") + ".pdf";
    return { blob: blob, filename: filename };
  }

  function generateQuotePdf(id){
    var q = state.quotes.find(function(x){return x.id===id;});
    if(!q) return;
    var c = clientById(q.clientId);
    var made = buildQuotePdf(q, c);
    if(!made) return;

    if(downloadsNs){
      downloadsNs.save({filename: made.filename, data: made.blob}).then(function(){
        toast("PDF saved");
      }).catch(function(err){
        if(err && err.code==="declined") return;
        fallbackOpenPdf(made.blob);
      });
    } else {
      fallbackOpenPdf(made.blob);
    }
  }
  function fallbackOpenPdf(blob){
    var url = URL.createObjectURL(blob);
    window.open(url, "_blank");
    toast("PDF opened in a new tab");
  }

  function shareQuotePdf(id){
    var q = state.quotes.find(function(x){return x.id===id;});
    if(!q) return;
    var c = clientById(q.clientId);
    var made = buildQuotePdf(q, c);
    if(!made) return;
    var file = new File([made.blob], made.filename, {type:"application/pdf"});
    var shareData = {
      files: [file],
      title: (q.isInvoice?"Invoice ":"Quote ") + q.number,
      text: buildQuoteMessage(q, c)
    };
    if(navigator.canShare && navigator.canShare({files:[file]})){
      navigator.share(shareData).catch(function(err){
        if(err && err.name==="AbortError") return;
        fallbackOpenPdf(made.blob);
      });
    } else if(navigator.share){
      navigator.share({title:shareData.title, text:shareData.text}).catch(function(){});
      fallbackOpenPdf(made.blob);
      toast("Your browser can't attach the PDF directly — opened it so you can attach it manually");
    } else {
      fallbackOpenPdf(made.blob);
      toast("Sharing isn't supported here — opened the PDF so you can attach it manually");
    }
  }

  /* ---------------- backup export ---------------- */
  function exportBackup(){
    var blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
    var filename = "ar7_service_backup_"+todayIso()+".json";
    if(downloadsNs){
      downloadsNs.save({filename:filename, data:blob}).then(function(){ toast("Backup saved"); }).catch(function(err){
        if(err && err.code==="declined") return;
        var url = URL.createObjectURL(blob); window.open(url,"_blank");
      });
    } else {
      var url = URL.createObjectURL(blob); window.open(url,"_blank");
    }
  }

  /* ---------------- init ---------------- */
  document.addEventListener("click", function(e){
    var navBtn = e.target.closest("[data-nav]");
    if(navBtn){
      view = navBtn.getAttribute("data-nav");
      search = "";
      render();
    }
    if(e.target.id === "overlay"){ closeModal(); }
  });
  document.getElementById("overlay").addEventListener("click", function(e){
    if(e.target.id==="overlay") closeModal();
  });
  document.addEventListener("keydown", function(e){
    if(e.key==="Escape") closeModal();
  });
  document.getElementById("exportBtn").addEventListener("click", exportBackup);

  initCapability();
  initDownloads();
  render();
})();
</script>
